name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.GH_PAT }}
          HOMEBREW_BUMP_TAG: ${{ github.ref_name }}

  homebrew:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v4
        with:
          token: ${{ secrets.GH_PAT }}
          tap: DevHatRo/homebrew-tap
          formula: tf-state-move
          tag: ${{ github.ref_name }}
          revision: ${{ github.sha }}
          force: true
          message: |
            Automated release of tf-state-move ${{ github.ref_name }}
            
            Created by GitHub Actions
