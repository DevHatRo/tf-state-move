version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
      gomod-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
      github-actions-major:
        update-types: [major]
