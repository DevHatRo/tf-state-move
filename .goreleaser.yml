version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X main.Version={{.Version}}
    binary: tf-state-move

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

release:
  # release-please creates the GitHub release (and tag) with the changelog as
  # its body; GoReleaser only uploads the artifacts to it and leaves the
  # name/body untouched.
  mode: keep-existing

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from release-please (CHANGELOG.md).
changelog:
  disable: true

homebrew_casks:
  - name: tf-state-move
    repository:
      owner: DevHatRo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/DevHatRo/tf-state-move"
    description: "A tool to move resources between Terraform state files"
    # Don't auto-bump the cask on pre-releases/snapshots.
    skip_upload: auto
    binaries:
      - tf-state-move
    # Strip the quarantine xattr so the unsigned binary runs without Gatekeeper prompts.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tf-state-move"]
          end
