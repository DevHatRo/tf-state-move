before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X main.Version={{.Version}}
    binary: tf-state-move

release:
  # Customize the release
  header: |
    ## tf-state-move {{ .Version }}

    ### Binaries:
    - Linux: 
      - AMD64: `tf-state-move-linux-amd64`
      - ARM64: `tf-state-move-linux-arm64`
      - ARMv6: `tf-state-move-linux-arm-6`
      - ARMv7: `tf-state-move-linux-arm-7`
    - macOS:
      - AMD64: `tf-state-move-darwin-amd64`
      - ARM64: `tf-state-move-darwin-arm64` (Apple Silicon)
    - Windows:
      - AMD64: `tf-state-move-windows-amd64.exe`
      - ARM64: `tf-state-move-windows-arm64.exe`

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: tf-state-move
    repository:
      owner: DevHatRo
      name: homebrew-tap
    homepage: "https://github.com/DevHatRo/tf-state-move"
    description: "A tool to move resources between Terraform state files"
    license: "MIT"
    test: |
      system "#{bin}/tf-state-move --version"
    install: |
      bin.install "tf-state-move"
